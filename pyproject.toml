[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaminustwo"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "numpy==1.26.4",
    "transformers",
    "datasets",
    "tqdm",
    "torch",
    "wandb",
    "stockfish",
    "kagglehub",
    "pytest",
    "chess",
    "python-dotenv>=1.2.2",
]

[tool.setuptools]
package-dir = { "" = "." }

[tool.setuptools.package-data]
"*" = ["py.typed"]

